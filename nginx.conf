server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets with content hashes (cache for 1 year)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Images, fonts, and documents
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|woff2?|eot|ttf|otf|svg|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Sitemap and robots
    location ~* \.(?:xml|txt)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # Withdrawn catalog paths (ARSA-028) — real 301s, so the old-site aliases
    # keep their history instead of resolving to a page that no longer exists.
    # The build also emits meta-refresh stubs for hosts that are not nginx;
    # these exact-match locations take precedence over them here.
    location = /content/aa                  { return 301 /products; }
    location = /content/bb                  { return 301 /products; }
    location = /content/hh                  { return 301 /products; }
    location = /content/colorful-patch-work { return 301 /products; }
    location ~ ^(/(?:fa|tr|es|ja|de|ru|ar|zh))?/categories/(?:patch-work|selected-available-rugs)/?$ {
        return 301 $1/products;
    }

    # Default fallback for clean URLs. No /index.html fallback: this is a static
    # site with a page per route, so an unmatched path is a genuine 404 and must
    # say so. Falling back to the homepage would answer every removed or
    # mistyped URL with 200 and hide the 404 page below.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Custom 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
